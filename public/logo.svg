<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.25" flood-color="#064e3b" />
    </filter>
  </defs>

  <!-- Background Hexagon Shield -->
  <polygon points="100,12 178,54 178,146 100,188 22,146 22,54" fill="url(#nexusGrad)" filter="url(#shadow)" rx="16" />
  <polygon points="100,20 170,58 170,142 100,180 30,142 30,58" fill="#0f172a" fill-opacity="0.88" />

  <!-- Graduation Cap (Top Icon) -->
  <path d="M100,46 L148,66 L100,86 L52,66 Z" fill="url(#nexusGrad)" />
  <path d="M148,66 L148,90 C148,90 142,98 100,98 C58,98 52,90 52,90 L52,66" fill="none" stroke="url(#nexusGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Tassel -->
  <path d="M136,71 L152,86 L152,106" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  <circle cx="152" cy="108" r="3" fill="url(#goldGrad)" />

  <!-- Open Book & Knowledge Nexus (Bottom Icon) -->
  <path d="M100,118 C115,108 140,108 156,112 L156,152 C140,148 115,148 100,158 C85,148 60,148 44,152 L44,112 C60,108 85,108 100,118 Z" fill="#ffffff" fill-opacity="0.95" />
  <line x1="100" y1="118" x2="100" y2="158" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  <path d="M60,124 Q80,122 92,128" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" />
  <path d="M60,134 Q80,132 92,138" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" />
  <path d="M140,124 Q120,122 108,128" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" />
  <path d="M140,134 Q120,132 108,138" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" />

  <!-- Central Star of Academic Excellence -->
  <circle cx="100" cy="102" r="5" fill="url(#goldGrad)" />
</svg>
